@if (data) {
  <header class="docsHeader">
    <div class="docsHeader__content">
      <img src="/assets/images/library/header/library-logo.svg" alt="logo" class="docsHeader__logo">
      <div class="docsHeader__title-wrapper">
        <h1 class="docsHeader__title">{{data.title}}</h1>
        <air-tag [data]="{text: data.version}"></air-tag>
      </div>
      <p class="docsHeader__description">
        {{data.description}}
      </p>
      <div class="docsHeader__copyright">2026 HAULMER ·  All rights reserved</div>
    </div>
  </header>
}
