<mat-tab-group>
  <mat-tab label="Demo">
    <div class="demo-container">
      <air-tag
        color="grey"
        size="s"
        [data]="{text: 'Body text', iconStart: 'layers', iconEnd: 'x-close'}"
        (onIconEndClick)="onIconEndClick()">
      </air-tag>
    </div>
  </mat-tab>

  <mat-tab label="html">
    <pre><code>{{ templateCode }}</code></pre>
  </mat-tab>

  <mat-tab label="ts">
    <pre><code>{{ componentCode }}</code></pre>
  </mat-tab>
</mat-tab-group>
