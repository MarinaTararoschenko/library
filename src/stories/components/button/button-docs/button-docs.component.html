<app-docs>
  <!-- HEADER -->
  <app-docs-header [data]="headerData"></app-docs-header>

  <!-- 01 OVERVIEW -->
  <app-docs-section [title]="'01 Overview'" class="first columns">
    @if (cardsOverview; as cards) {
      @for (card of cards; track $index) {
        <app-docs-card [title]="card.title">

          <!-- If there is a list -->
          @if (card.list; as list) {
            <app-docs-card-list [data]="list"></app-docs-card-list>
          }

        </app-docs-card>
      }
    }
  </app-docs-section>

  <!-- 02 ANATOMY -->
  <app-docs-section [title]="'02 Anatomy'">
    <app-docs-card class="no-padding">
      <app-button-docs-anatomy></app-button-docs-anatomy>
    </app-docs-card>
  </app-docs-section>

  <!-- 03 PROPERTIES - Variantes visuales -->
  <app-docs-section [title]="'03 Properties'">
    <app-docs-section-subtitle [text]="'Variantes visuales'"></app-docs-section-subtitle>
    <app-docs-card>
      <app-button-docs-variants></app-button-docs-variants>
    </app-docs-card>

    <app-docs-section-subtitle [text]="'Tamaños'"></app-docs-section-subtitle>
    <app-docs-card>
      <app-button-docs-sizes></app-button-docs-sizes>
    </app-docs-card>
  </app-docs-section>

  <!-- 04 BEHAVIOR -->
  <app-docs-section [title]="'04 Behavior'">
    <app-docs-section-subtitle [text]="'Interacciones y transiciones'"></app-docs-section-subtitle>
    <app-docs-card>
      <app-docs-card-text [text]="behaviorIteractionsText"></app-docs-card-text>

      <app-docs-card-box class="light">
        <div class="button-row">
          <app-button theme="primary" type="primary" [data]="{text: 'Default'}"></app-button>
          <app-button theme="primary" type="secondary" [data]="{text: 'Default'}"></app-button>
          <app-button theme="primary" type="tertiary" [data]="{text: 'Default'}"></app-button>
        </div>
      </app-docs-card-box>
    </app-docs-card>

    <app-docs-section-subtitle [text]="'Responsividad'"></app-docs-section-subtitle>
    <app-docs-card>
      <div class="">
        <app-docs-card-header [data]="{label: '← Desktop', badge: 'Body text'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <app-button
            theme="primary"
            type="primary"
            size="large"
            [data]="{text: 'Continuar', iconEnd: icons.chevronRight}">
          </app-button>
        </app-docs-card-box>
      </div>

      <div class="mobile-md">
        <app-docs-card-header [data]="{label: '← Tablet', badge: 'Body text'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <app-button
            theme="primary"
            type="primary"
            size="medium"
            [data]="{text: 'Continuar', iconEnd: icons.chevronRight}">
          </app-button>
        </app-docs-card-box>
      </div>
      <div class="mobile-xs">
        <app-docs-card-header [data]="{label: '← Mobile', badge: 'Body text'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <app-button
            theme="primary"
            type="primary"
            size="small"
            [data]="{text: 'Continuar', iconEnd: icons.chevronRight}">
          </app-button>
          </app-docs-card-box>
      </div>
    </app-docs-card>
  </app-docs-section>

  <!-- 05 ACCESSIBILITY -->
  <app-docs-section [title]="'05 Accessibility'">
    <app-docs-section-subtitle [text]="'Criterios base'"></app-docs-section-subtitle>
    <app-docs-card>
      <app-docs-card-text [text]="accessibilityText"></app-docs-card-text>
    </app-docs-card>

    <app-docs-section-subtitle [text]="'Especificación técnica'"></app-docs-section-subtitle>
    <app-docs-card>
      <app-docs-card-list [data]="accessibilityList"></app-docs-card-list>
    </app-docs-card>
  </app-docs-section>

  <!-- 06 USER GUIDELINES -->
  <app-docs-section [title]="'06 User Guidelines'" class="columns">
    <app-docs-card class="success">
      <app-docs-card-guideline-status [status]="'success'" [text]="'Do'"></app-docs-card-guideline-status>

      <div>
        <app-docs-card-text
          [text]="'Usar un solo botón primary como CTA principal, acompañado de acciones secundarias.'">
        </app-docs-card-text>
        <div class="button-row">
          <app-button theme="primary" type="primary" [data]="{text: 'Primary'}"></app-button>
          <app-button theme="primary" type="secondary" [data]="{text: 'Secondary'}"></app-button>
          <app-button theme="primary" type="tertiary" [data]="{text: 'Tertiary'}"></app-button>
        </div>
      </div>

      <div>
        <app-docs-card-text
          [text]="'Usar danger únicamente para acciones destructivas, con confirmación previa.'">
        </app-docs-card-text>
        <app-button theme="primary" type="danger" [data]="{text: 'Eliminar cuenta'}"></app-button>
      </div>

      <div>
        <app-docs-card-text
          [text]="'En mobile, adaptar el tamaño del botón al contenedor para mejorar el área táctil.'">
        </app-docs-card-text>
        <div class="mobile-xxs">
          <app-button theme="primary" type="primary" size="small"
            [data]="{text: 'Confirmar', iconStart: icons.layers}"></app-button>
        </div>
      </div>
    </app-docs-card>

    <app-docs-card class="error">
      <app-docs-card-guideline-status [status]="'error'" [text]="'Don\'t'"></app-docs-card-guideline-status>

      <div>
        <app-docs-card-text
          [text]="'No usar múltiples botones primary en la misma sección — compiten por la atención del usuario.'">
        </app-docs-card-text>

        <div class="button-row">
          <app-button theme="primary" type="primary" [data]="{text: 'Primary'}"></app-button>
          <app-button theme="primary" type="primary" [data]="{text: 'Primary'}"></app-button>
          <app-button theme="primary" type="primary" [data]="{text: 'Primary'}"></app-button>
        </div>
      </div>

      <div>
        <app-docs-card-text
          [text]="'No usar danger para acciones neutras — reservar el color rojo para acciones realmente destructivas.'">
        </app-docs-card-text>
        <app-button theme="primary" type="danger" [data]="{text: 'Configuración'}"></app-button>
      </div>
    </app-docs-card>
  </app-docs-section>
</app-docs>
