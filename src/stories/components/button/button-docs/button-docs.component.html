<app-docs>
  <!-- HEADER -->
  <app-docs-header [data]="headerData" docsHeader></app-docs-header>

  <app-docs-section class="first">
    <app-docs-card>
      <app-button-docs-code></app-button-docs-code>
    </app-docs-card>
  </app-docs-section>

  <!-- 01 OVERVIEW -->
  <app-docs-section [title]="'01 Overview'" class="columns">
    @if (cardsOverview; as cards) {
      @for (card of cards; track $index) {
        <app-docs-card [title]="card.title">

          <!-- If there is a list -->
          @if (card.list; as list) {
            <app-docs-card-list [data]="list"></app-docs-card-list>
          }

        </app-docs-card>
      }
    }
  </app-docs-section>

  <!-- 02 ANATOMY -->
  <app-docs-section [title]="'02 Anatomy'">
    <app-docs-card>
      <app-button-docs-anatomy></app-button-docs-anatomy>
    </app-docs-card>
  </app-docs-section>

  <!-- 03 PROPERTIES - Variantes visuales -->
  <app-docs-section [title]="'03 Properties'">
    <app-docs-card [title]="'Variantes visuales'">
      <mat-divider></mat-divider>
      <app-button-docs-variants></app-button-docs-variants>
    </app-docs-card>

    <app-docs-card [title]="'Tamaños'">
      <mat-divider></mat-divider>
      <app-button-docs-sizes></app-button-docs-sizes>
    </app-docs-card>

    <app-docs-card [title]="'Estados'">
      <mat-divider></mat-divider>
      <app-button-docs-states></app-button-docs-states>
    </app-docs-card>
  </app-docs-section>

  <!-- 04 BEHAVIOR -->
  <app-docs-section [title]="'04 Behavior'">
    <app-docs-card [title]="'Interacciones'">
      <mat-divider></mat-divider>

      <div class="container-column">
        <air-button
          theme="primary"
          type="primary"
          size="2xl"
          [data]="{text: 'Body text', iconStart: 'layers', iconEnd: 'angle-right'}">
        </air-button>
        <app-docs-card-tag [text]="'Hover/ Pressed IconButton'" class="bottom"></app-docs-card-tag>
      </div>
    </app-docs-card>

    <app-docs-card [title]="'Responsividad'">
      <mat-divider></mat-divider>

      <div class="">
        <app-docs-card-header [data]="{label: '← Desktop', badge: 'Body text'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <air-button
            theme="primary"
            type="primary"
            size="l"
            [data]="{text: 'Continuar', iconEnd: icons.chevronRight}">
          </air-button>
        </app-docs-card-box>
      </div>

      <div class="mobile-md">
        <app-docs-card-header [data]="{label: '← Tablet', badge: 'Body text'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <air-button
            theme="primary"
            type="primary"
            size="m"
            [data]="{text: 'Continuar', iconEnd: icons.chevronRight}">
          </air-button>
        </app-docs-card-box>
      </div>
      <div class="mobile-xs">
        <app-docs-card-header [data]="{label: '← Mobile', badge: 'Body text'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <air-button
            theme="primary"
            type="primary"
            size="s"
            [data]="{text: 'Continuar', iconEnd: icons.chevronRight}">
          </air-button>
          </app-docs-card-box>
      </div>
    </app-docs-card>
  </app-docs-section>

  <!-- 05 ACCESSIBILITY -->
  <app-docs-section [title]="'05 Accessibility'">
    <app-docs-card [title]="'Criterios base'">
      <app-docs-card-text [text]="accessibilityText"></app-docs-card-text>
    </app-docs-card>

    <app-docs-card [title]="'Específico de este componente'">
      <app-docs-card-list [data]="accessibilityList"></app-docs-card-list>
    </app-docs-card>
  </app-docs-section>

  <!-- 06 USER GUIDELINES -->
  <app-docs-section [title]="'06 User guidelines'" class="columns">
    <app-docs-card class="success">
      <app-docs-card-guideline-status [status]="'success'" [text]="'Do'"></app-docs-card-guideline-status>

      <app-docs-card>
        <app-docs-card-text
          [text]="'Respetar la jerarquía visual entre variantes usando primary para la acción más importante.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-button
            theme="primary"
            type="primary"
            size="2xl"
            [data]="{text: 'Primary', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
          <air-button
            theme="primary"
            type="secondary"
            size="2xl"
            [data]="{text: 'Secondary', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
          <air-button
            theme="primary"
            type="tertiary"
            size="2xl"
            [data]="{text: 'Tertiary', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'Usar la variante danger para acciones irreversibles que requieren advertir al usuario'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-button
            theme="primary"
            type="danger"
            size="2xl"
            [data]="{text: 'Danger', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'En mobile el botón ocupa el ancho completo disponible adaptándose al breakpoint'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="mobile-md">
          <air-button
            theme="primary"
            type="primary"
            size="s"
            [data]="{text: 'Body text', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
        </div>
      </app-docs-card>
    </app-docs-card>

    <app-docs-card class="error">
      <app-docs-card-guideline-status [status]="'error'" [text]="'Don\'t'"></app-docs-card-guideline-status>

      <app-docs-card>
        <app-docs-card-text
          [text]="'No usar más de un botón primary en la misma zona de acciones.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-button
            theme="primary"
            type="primary"
            size="2xl"
            [data]="{text: 'Primary', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
          <air-button
            theme="primary"
            type="primary"
            size="2xl"
            [data]="{text: 'Primary', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
          <air-button
            theme="primary"
            type="primary"
            size="2xl"
            [data]="{text: 'Primary', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'No usar botones de distinto tamaño en una misma zona de acciones sin que el contexto lo justifique'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-button
            theme="primary"
            type="primary"
            size="2xl"
            [data]="{text: 'Aceptar', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
          <air-button
            theme="primary"
            type="secondary"
            size="s"
            [data]="{text: 'Cancelar', iconStart: 'layers', iconEnd: 'angle-right'}">
          </air-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'No dejar un botón en estado loading indefinidamente sin comunicar el resultado de la acción.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-button
            theme="primary"
            type="primary"
            size="2xl"
            [data]="{text: 'Configuración'}"
            [isLoading]="true">
          </air-button>
        </div>
      </app-docs-card>
    </app-docs-card>
  </app-docs-section>
</app-docs>
