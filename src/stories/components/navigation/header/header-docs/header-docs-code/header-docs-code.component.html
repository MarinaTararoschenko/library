<mat-tab-group>
  <mat-tab label="Demo">
    <div class="demo-container">
      <air-header
        [data]="data"
        (backClick)="backClick()"
        (actionButtonClick)="actionButtonClick($event)">
      </air-header>
    </div>
  </mat-tab>

  <mat-tab label="html">
    <pre><code>{{ templateCode }}</code></pre>
  </mat-tab>

  <mat-tab label="ts">
    <pre><code>{{ componentCode }}</code></pre>
  </mat-tab>
</mat-tab-group>
