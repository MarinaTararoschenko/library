<mat-card>
  <mat-card-content>
    <mat-tab-group>
      <mat-tab label="Demo">
        <div class="demo-container mat-typography">
          <app-form-field-input [data]="dataInput" [form]="form" (emitClick)="clear($event)"></app-form-field-input>
        </div>
      </mat-tab>

      <mat-tab label="html">
        <pre><code>{{ templateCode }}</code></pre>
      </mat-tab>

      <mat-tab label="ts">
        <pre><code>{{ componentCode }}</code></pre>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
