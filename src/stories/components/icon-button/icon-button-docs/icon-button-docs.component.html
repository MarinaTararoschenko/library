<app-docs>
  <!-- HEADER -->
  <app-docs-header [data]="headerData" docsHeader></app-docs-header>

  <app-docs-section class="first">
    <app-docs-card>
      <app-icon-button-docs-code></app-icon-button-docs-code>
    </app-docs-card>
  </app-docs-section>

  <!-- 01 OVERVIEW -->
  <app-docs-section [title]="'01 Overview'" class="columns">
    @if (cardsOverview; as cards) {
      @for (card of cards; track $index) {
        <app-docs-card [title]="card.title">

          <!-- If there is a list -->
          @if (card.list; as list) {
            <app-docs-card-list [data]="list"></app-docs-card-list>
          }

        </app-docs-card>
      }
    }
  </app-docs-section>

  <!-- 02 ANATOMY -->
  <app-docs-section [title]="'02 Anatomy'">
    <app-docs-card>
      <app-icon-button-docs-anatomy></app-icon-button-docs-anatomy>
    </app-docs-card>
  </app-docs-section>

  <!-- 03 PROPERTIES - Variantes visuales -->
  <app-docs-section [title]="'03 Properties'">
    <app-docs-card [title]="'Variantes visuales'">
      <app-icon-button-docs-variants></app-icon-button-docs-variants>
    </app-docs-card>

    <app-docs-card [title]="'Tamaños'">
      <app-icon-button-docs-sizes></app-icon-button-docs-sizes>
    </app-docs-card>
  </app-docs-section>

  <!-- 04 BEHAVIOR -->
  <app-docs-section [title]="'04 Behavior'">
    <app-docs-card [title]="'Interacciones'">
      <mat-divider></mat-divider>

      <div class="container-column">
        <air-icon-button type="primary" size="2xl" icon="layers"></air-icon-button>
        <app-docs-card-tag [text]="'Hover/ Pressed '" class="bottom"></app-docs-card-tag>
      </div>

    </app-docs-card>

    <app-docs-card [title]="'Responsividad'">
      <div class="">
        <app-docs-card-header [data]="{label: '← Desktop', badge: 'Size L — 48px'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <div class="container-row">
            <air-icon-button type="primary" size="l" [icon]="icons.plus"></air-icon-button>
            <air-icon-button type="tertiary" size="l" [icon]="icons.search"></air-icon-button>
            <air-icon-button type="tertiary" size="l" [icon]="icons.settings"></air-icon-button>
          </div>
        </app-docs-card-box>
      </div>

      <div class="mobile-md">
        <app-docs-card-header [data]="{label: '← Tablet', badge: 'Size M — 40px'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <div class="container-row">
            <air-icon-button type="primary" size="m" [icon]="icons.plus"></air-icon-button>
            <air-icon-button type="tertiary" size="m" [icon]="icons.search"></air-icon-button>
            <air-icon-button type="tertiary" size="m" [icon]="icons.settings"></air-icon-button>
          </div>
        </app-docs-card-box>
      </div>
      <div class="mobile-xs">
        <app-docs-card-header [data]="{label: '← Mobile', badge: 'Size S — 32px'}"></app-docs-card-header>
        <app-docs-card-box class="light dashed">
          <div class="container-row">
            <air-icon-button type="primary" size="s" [icon]="icons.plus"></air-icon-button>
            <air-icon-button type="tertiary" size="s" [icon]="icons.search"></air-icon-button>
          </div>
        </app-docs-card-box>
      </div>
    </app-docs-card>
  </app-docs-section>

  <!-- 05 ACCESSIBILITY -->
  <app-docs-section [title]="'05 Accessibility'">
    <app-docs-card [title]="'Criterios base'">
      <app-docs-card-text [text]="accessibilityText"></app-docs-card-text>
    </app-docs-card>

    <app-docs-card [title]="'Específico de este componente'">
      <app-docs-card-list [data]="accessibilityList"></app-docs-card-list>
    </app-docs-card>
  </app-docs-section>

  <!-- 06 USER GUIDELINES -->
  <app-docs-section [title]="'06 User Guidelines'" class="columns">
    <app-docs-card class="success">
      <app-docs-card-guideline-status [status]="'success'" [text]="'Do'"></app-docs-card-guideline-status>

      <app-docs-card>
        <app-docs-card-text
          [text]="'Usar íconos que representen con precisión la acción que ejecuta el botón.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-icon-button theme="primary" type="primary" size="2xl" icon="edit"></air-icon-button>
          <air-icon-button theme="neutral" type="secondary" size="2xl" icon="trash"></air-icon-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'Agrupar Icon Buttons cuando las acciones están relacionadas entre sí dentro de la misma zona'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-icon-button theme="primary" type="primary" size="2xl" icon="check"></air-icon-button>
          <air-icon-button theme="neutral" type="secondary" size="2xl" icon="cross"></air-icon-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'El tamaño del Icon Button debe ser proporcional al contexto donde se usa.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-icon-button theme="primary" type="primary" size="l" icon="layers"></air-icon-button>
        </div>
      </app-docs-card>
    </app-docs-card>

    <app-docs-card class="error">
      <app-docs-card-guideline-status [status]="'error'" [text]="'Don\'t'"></app-docs-card-guideline-status>

      <app-docs-card>
        <app-docs-card-text
          [text]="'No usar íconos genéricos o ambiguos que no comunican claramente la acción.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-icon-button theme="primary" type="primary" size="2xl" icon="speaker"></air-icon-button>
          <air-icon-button theme="neutral" type="secondary" size="2xl" icon="drumstick"></air-icon-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'No agrupar demasiados Icon Buttons en una misma zona generando sobrecarga visual.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-icon-button theme="primary" type="tonal" size="2xl" icon="layers"></air-icon-button>
          <air-icon-button theme="primary" type="tonal" size="2xl" icon="layers"></air-icon-button>
          <air-icon-button theme="primary" type="tertiary" size="2xl" icon="layers"></air-icon-button>
          <air-icon-button theme="primary" type="secondary" size="2xl" icon="layers"></air-icon-button>
          <air-icon-button theme="primary" type="primary" size="2xl" icon="layers"></air-icon-button>
        </div>
      </app-docs-card>

      <app-docs-card>
        <app-docs-card-text
          [text]="'No mezclar Icon Buttons de distinto tamaño en una misma zona de acciones sin que el contexto lo justifique.'">
        </app-docs-card-text>
        <mat-divider></mat-divider>

        <div class="container-row">
          <air-icon-button theme="primary" type="tertiary" size="xs" icon="layers"></air-icon-button>
          <air-icon-button theme="primary" type="secondary" size="m" icon="layers"></air-icon-button>
          <air-icon-button theme="primary" type="primary" size="l" icon="layers"></air-icon-button>
        </div>
      </app-docs-card>
    </app-docs-card>
  </app-docs-section>

</app-docs>
