<div class="anatomy">
  <div class="anatomy__top">
    <div class="anatomy__pill-container">
      <span class="anatomy__pill">air-icon-button &lt;button&gt;</span>
      <div class="anatomy__line-vertical"></div>
      <div class="anatomy__dot"></div>
    </div>
  </div>
  <div class="anatomy__dashed-box">
    <div class="anatomy__content">
      <div class="anatomy__icons-row">
        <div class="anatomy__left-label">
          <span class="anatomy__pill">border-radius — token</span>
          <div class="anatomy__l-connector-left"></div>
        </div>
        <app-icon-button
          variant="primary"
          size="large"
          [icon]="'plus'"
          ariaLabel="Add">
        </app-icon-button>
        <div class="anatomy__right-label">
          <span class="anatomy__pill">ícono — 55% del tamaño</span>
          <div class="anatomy__l-connector-right"></div>
        </div>
      </div>
      <div class="anatomy__bottom">
        <div class="anatomy__dot-small"></div>
        <div class="anatomy__line-vertical-small"></div>
        <span class="anatomy__pill">48×48px — tamaño L</span>
      </div>
    </div>
  </div>
  <div class="anatomy__sizes">
    <span>XS: <strong>24×24px</strong></span>
    <span>S: <strong>32×32px</strong></span>
    <span>M: <strong>40×40px</strong></span>
    <span>L: <strong>48×48px</strong></span>
    <span>XL: <strong>56×56px</strong></span>
    <span>2XL: <strong>64×64px</strong></span>
  </div>
</div>
