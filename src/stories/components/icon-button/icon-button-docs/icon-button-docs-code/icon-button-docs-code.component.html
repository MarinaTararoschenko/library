<mat-tab-group>
  <mat-tab label="Demo">
    <div class="demo-container">
      <air-icon-button
        theme="primary"
        type="primary"
        size="m"
        icon="plus"
        (buttonClick)="onAction()">
      </air-icon-button>

      <air-icon-button
        theme="primary"
        type="secondary"
        size="m"
        icon="edit"
        (buttonClick)="onAction()">
      </air-icon-button>

      <air-icon-button
        theme="primary"
        type="tertiary"
        size="m"
        icon="search"
        (buttonClick)="onAction()">
      </air-icon-button>

      <air-icon-button
        theme="primary"
        type="tonal"
        size="m"
        icon="star"
        (buttonClick)="onAction()">
      </air-icon-button>

      <air-icon-button
        theme="primary"
        type="danger"
        size="m"
        icon="trash"
        (buttonClick)="onAction()">
      </air-icon-button>
    </div>
  </mat-tab>

  <mat-tab label="html">
    <pre><code>{{ templateCode }}</code></pre>
  </mat-tab>

  <mat-tab label="ts">
    <pre><code>{{ componentCode }}</code></pre>
  </mat-tab>
</mat-tab-group>
