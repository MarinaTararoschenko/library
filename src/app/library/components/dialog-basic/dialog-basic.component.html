<div class="dialog-header" [class.dialog-header__center]="dialogData.style === 'icon'">
  @if (dialogData.style === 'icon' && dialogData.icon) {
    <mat-icon class="size-24 color-primary" [svgIcon]="dialogData.icon"></mat-icon>
  }
  <h2 class="mat-subtitle-1 color-primary" [class.center]="dialogData.style === 'icon'">
    {{dialogData.title}}
  </h2>

  @if (dialogData.style === 'text') {
    <button mat-icon-button mat-dialog-close>
      <mat-icon class="size-24 color-primary" svgIcon="cross"></mat-icon>
    </button>
  }
</div>

<mat-dialog-content>
  <div class="mat-body-2 color-secondary">
    {{dialogData.description}}
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <air-button
    theme="primary"
    type="secondary"
    size="m"
    [data]="{ text: dialogData.actions[0].text }"
    (buttonClick)="dialog.closeAll()">
  </air-button>

  <air-button
    theme="primary"
    type="primary"
    size="m"
    [data]="{ text: dialogData.actions[1].text }">
  </air-button>
</mat-dialog-actions>
