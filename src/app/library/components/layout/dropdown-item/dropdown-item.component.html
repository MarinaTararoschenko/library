<button
  mat-button
  [id]="data.id ? data.id : null"
  class="dropdownItem"
  [class.active]="selected"
  [disabled]="data.disabled"
  (click)="onButtonClick($event)">

  <div class="dropdownItem__container">
    @if (data.checkbox && form) {
      <air-checkbox
        [data]="data.checkbox"
        [form]="form"
        (checkboxClick)="onCheckboxClick($event)">
      </air-checkbox>
    }

    @if (data.icon) {
      <mat-icon [svgIcon]="data.icon" class="size-20"></mat-icon>
    }

    <div class="dropdownItem__content">
      <div class="dropdownItem__text">
        {{data.text}}
      </div>
      @if (data.subtext) {
        <div class="dropdownItem__subtext">
          {{data.subtext}}
        </div>
      }
    </div>

    @if (data.badge; as badge) {
      <air-badge [text]="badge" color="blue" size="m"></air-badge>
    }
  </div>
</button>
