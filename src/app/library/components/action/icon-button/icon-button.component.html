<button
  mat-icon-button
  [ngClass]="'size-' + currentSize + ' type-' + currentType + ' theme-' + currentTheme"
  [disabled]="disabled || isLoading"
  (click)="buttonClick.emit()">
  @if (isLoading) {
    <mat-spinner
      [diameter]="iconSize"
      [color]="(currentType === 'danger' || currentType === 'dangerText') ? 'warn' : 'custom-theme'"
      [ngClass]="'size-' + iconSize"
      [class.mat-custom-theme]="currentType !== 'danger' && currentType !== 'dangerText'">
    </mat-spinner>
  } @else {
    <mat-icon [svgIcon]="icon" [ngClass]="'size-' + iconSize"></mat-icon>

    @if (badge) {
      <air-badge [text]="badge.text" [color]="badge.color" [size]="badge.size"></air-badge>
    }
  }
</button>
